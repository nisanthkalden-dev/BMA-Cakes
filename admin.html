<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMA CAKES | Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>

  <!-- LOGIN PAGE -->
  <section id="loginPage" class="login-page">
    <div class="login-bg">
      <div class="floating-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
        <div class="shape shape-4"></div>
      </div>
    </div>
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <i class="fas fa-birthday-cake"></i>
          </div>
          <h1>BMA <span>CAKES</span></h1>
          <p>Admin Dashboard</p>
        </div>

        <div class="login-form">
          <div class="input-group">
            <div class="input-icon"><i class="fas fa-envelope"></i></div>
            <input type="email" id="email" placeholder="Email Address" autocomplete="off">
          </div>
          <div class="input-group">
            <div class="input-icon"><i class="fas fa-lock"></i></div>
            <input type="password" id="password" placeholder="Password" autocomplete="off">
            <button class="toggle-password" type="button" onclick="togglePassword()">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>

          <div id="loginError" class="login-error"></div>

          <button class="login-btn" onclick="login()" id="loginBtn">
            <span>Sign In</span>
            <i class="fas fa-arrow-right"></i>
          </button>
        </div>

        <div class="login-footer">
          <a href="index.html"><i class="fas fa-arrow-left"></i> Back to Website</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ADMIN DASHBOARD -->
  <section id="adminDashboard" class="dashboard" style="display:none;">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <i class="fas fa-birthday-cake"></i>
        <span>BMA CAKES</span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="sidebar-link active" data-tab="overview">
          <i class="fas fa-chart-pie"></i> Overview
        </a>
        <a href="#" class="sidebar-link" data-tab="addCake">
          <i class="fas fa-plus-circle"></i> Add Cake
        </a>
        <a href="#" class="sidebar-link" data-tab="manageCakes">
          <i class="fas fa-list"></i> Manage Cakes
        </a>
      </nav>
      <div class="sidebar-footer">
        <a href="index.html" class="sidebar-link">
          <i class="fas fa-globe"></i> View Website
        </a>
        <button class="logout-btn" onclick="logout()">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <!-- Top Bar -->
      <div class="topbar">
        <button class="sidebar-toggle" id="sidebarToggle">
          <i class="fas fa-bars"></i>
        </button>
        <h2 id="pageTitle">Dashboard Overview</h2>
        <div class="topbar-user">
          <div class="user-avatar"><i class="fas fa-user"></i></div>
          <span id="userEmail">Admin</span>
        </div>
      </div>

      <!-- OVERVIEW TAB -->
      <div class="tab-content active" id="tab-overview">
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(255, 215, 0, 0.15); color: #FFD700;">
              <i class="fas fa-birthday-cake"></i>
            </div>
            <div>
              <h3 id="totalCakes">0</h3>
              <p>Total Cakes</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(37, 211, 102, 0.15); color: #25D366;">
              <i class="fas fa-tags"></i>
            </div>
            <div>
              <h3 id="totalCategories">0</h3>
              <p>Categories</p>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon" style="background: rgba(255, 77, 109, 0.15); color: #ff4d6d;">
              <i class="fas fa-rupee-sign"></i>
            </div>
            <div>
              <h3 id="avgPrice">0</h3>
              <p>Avg. Price</p>
            </div>
          </div>
        </div>

        <div class="recent-section">
          <h3>All Cakes</h3>
          <div id="overviewCakeList" class="overview-cake-list"></div>
        </div>
      </div>

      <!-- ADD CAKE TAB -->
      <div class="tab-content" id="tab-addCake">
        <div class="form-card">
          <h3><i class="fas fa-plus-circle"></i> Add New Cake</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Cake Name</label>
              <input type="text" id="cakeName" placeholder="Enter cake name">
            </div>
            <div class="form-group">
              <label>Price (Rs.)</label>
              <input type="number" id="cakePrice" placeholder="Enter price">
            </div>
            <div class="form-group">
              <label>Category</label>
              <select id="cakeCategory">
                <option value="classic">Classic</option>
                <option value="premium">Premium</option>
                <option value="custom">Custom</option>
              </select>
            </div>
            <div class="form-group">
              <label>Description</label>
              <input type="text" id="cakeDescription" placeholder="Short description">
            </div>
            <div class="form-group full-width">
              <label>Cake Image</label>
              <div class="image-upload-area" id="imageUploadArea">
                <input type="file" id="cakeImage" accept="image/*" style="display:none;">
                <div class="upload-placeholder" id="uploadPlaceholder">
                  <i class="fas fa-cloud-upload-alt"></i>
                  <p>Click to upload image or paste URL below</p>
                </div>
                <img id="imagePreview" class="image-preview" style="display:none;">
              </div>
              <input type="text" id="cakeImageUrl" placeholder="Or paste image URL here" style="margin-top:10px;">
            </div>
          </div>
          <button class="add-btn" onclick="addCake()" id="addCakeBtn">
            <i class="fas fa-plus"></i> Add Cake
          </button>
        </div>
      </div>

      <!-- MANAGE CAKES TAB -->
      <div class="tab-content" id="tab-manageCakes">
        <div class="manage-header">
          <h3><i class="fas fa-list"></i> Manage Cakes</h3>
          <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchCakes" placeholder="Search cakes..." oninput="filterCakes()">
          </div>
        </div>
        <div id="adminCakeList" class="admin-cake-grid"></div>
      </div>
    </main>
  </section>

  <!-- EDIT MODAL -->
  <div class="modal-overlay" id="editModal" style="display:none;">
    <div class="modal-card">
      <div class="modal-header">
        <h3><i class="fas fa-edit"></i> Edit Cake</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label>Cake Name</label>
            <input type="text" id="editName">
          </div>
          <div class="form-group">
            <label>Price</label>
            <input type="number" id="editPrice">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="editCategory">
              <option value="classic">Classic</option>
              <option value="premium">Premium</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="form-group">
            <label>Description</label>
            <input type="text" id="editDescription">
          </div>
        </div>
        <div class="form-group">
          <label>Cake Image</label>
          <div class="edit-image-upload" id="editImageUploadArea">
            <input type="file" id="editImageFile" accept="image/*" style="display:none;">
            <div class="edit-upload-btn" id="editUploadBtn">
              <i class="fas fa-upload"></i> Choose from Computer
            </div>
          </div>
          <input type="text" id="editImage" placeholder="Or paste image URL here" style="margin-top:8px;">
          <img id="editImagePreview" class="image-preview" style="display:none; margin-top:8px;">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        <button class="btn-save" onclick="saveEdit()"><i class="fas fa-save"></i> Save Changes</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

  <script src="firebase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
